<rect x="18" y="554" width="354" height="115" rx="18" fill="white" stroke="#e0e8dd"/>
<text x="38" y="585" font-family="Arial" font-size="15" font-weight="700" fill="#304539">¿Comenzar una nueva visita?</text>
<text x="38" y="611" font-family="Arial" font-size="11" fill="#65756c">Se borrarán las marcas de animales visitados</text>
<text x="38" y="630" font-family="Arial" font-size="11" fill="#65756c">durante la visita anterior de este dispositivo.</text>
<text x="38" y="650" font-family="Arial" font-size="10" font-weight="700" fill="#2f6b4b">Sin GPS, el reinicio se confirma manualmente.</text>
<rect x="18" y="690" width="168" height="52" rx="16" fill="#eef2ec" stroke="#dce5da"/>
<text x="102" y="722" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#405347">Cancelar</text>
<rect x="202" y="690" width="170" height="52" rx="16" fill="#2f6b4b"/>
<text x="287" y="722" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Iniciar visita</text>
<text x="195" y="775" text-anchor="middle" font-family="Arial" font-size="10" fill="#89948b">Puedes volver al mapa sin cambiar el progreso.</text>
</svg>

