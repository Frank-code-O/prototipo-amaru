<circle cx="184" cy="306" r="19" fill="#2f6b4b" stroke="white" stroke-width="4"/><path d="M174 306l7 7 13-15" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
