<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Confirmar nueva visita</title>
<desc id="desc">Confirmación para reiniciar manualmente el progreso de animales visitados al comenzar otra visita.</desc>
<rect width="390" height="844" fill="#f8faf6"/>
<text x="22" y="20" font-family="Arial" font-size="12" font-weight="700" fill="#26382f">9:41</text><text x="331" y="20" font-family="Arial" font-size="11" fill="#26382f">● Offline</text>
<text x="20" y="58" font-family="Arial" font-size="20" font-weight="700" fill="#20372e">Nueva visita</text>
<rect x="18" y="132" width="354" height="392" rx="24" fill="#eef4e9" stroke="#dce5da"/>
<path d="M55 430 C95 397 116 359 153 333 C190 307 222 278 247 232 C269 193 301 188 331 166" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
