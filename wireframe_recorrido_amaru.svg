<title id="title">Recorrido sugerido sobre el mapa de Amaru</title><desc id="desc">Circuito circular descrito por el usuario: inicia y termina en el letrero Usted inicia y termina aquí. La lista paso a paso contiene 24 paradas QR; piqueros de patas azules y tortugas de Galápagos comparten un QR.</desc>
