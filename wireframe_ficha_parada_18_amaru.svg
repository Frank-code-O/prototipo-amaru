<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img">
<title>Jaguar</title>
<rect width="390" height="844" fill="#F6F4EC"/>
<text x="20" y="30" font-family="Arial" font-size="16" fill="#20372e" font-weight="700">AMARU · Ficha educativa</text>
<text x="20" y="62" font-family="Arial" font-size="13" fill="#20372e">Parada 18 · un QR</text>
<text x="20" y="102" font-family="Arial" font-size="20" fill="#20372e" font-weight="700">Jaguar</text>
<text x="20" y="144" font-family="Arial" font-size="16" fill="#20372e" font-weight="700">Jaguar</text>
<text x="20" y="166" font-family="Arial" font-size="12" fill="#20372e">Panthera onca</text>
<text x="20" y="190" font-family="Arial" font-size="13" fill="#20372e" font-weight="700">Qué come</text>
<text x="20" y="211" font-family="Arial" font-size="14" fill="#20372e">Carne: caza pecaríes, venados, capibaras y</text>
<text x="20" y="230" font-family="Arial" font-size="14" fill="#20372e">reptiles, entre otras presas.</text>
<text x="20" y="259" font-family="Arial" font-size="13" fill="#20372e" font-weight="700">Dónde vive / origen</text>
<text x="20" y="280" font-family="Arial" font-size="14" fill="#20372e">América; principalmente selvas tropicales y</text>
<text x="20" y="299" font-family="Arial" font-size="14" fill="#20372e">áreas cercanas al agua, aunque ocupa otros</text>
<text x="20" y="318" font-family="Arial" font-size="14" fill="#20372e">ambientes.</text>
<text x="20" y="359" font-family="Arial" font-size="12" fill="#20372e">Información general de la especie; no describe la</text>
<text x="20" y="376" font-family="Arial" font-size="12" fill="#20372e">dieta del recinto de Amaru.</text>
<rect x="18" y="704" width="354" height="48" rx="14" fill="#2F6B4B"/>
<text x="195" y="734" text-anchor="middle" font-family="Arial" font-size="15" fill="white">Ver en el mapa</text>
<text x="20" y="790" font-family="Arial" font-size="12" fill="#20372e">Diseño académico · lectura QR simulada</text>
