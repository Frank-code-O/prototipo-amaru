<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>Buitres negros y curiquingues: una parada QR</title><rect width="390" height="844" fill="#F6F4EC"/>
<text x="20" y="36" font-family="Arial" font-size="18" fill="#20372E" font-weight="700">Ficha educativa</text>
<text x="20" y="87" font-family="Arial" font-size="20" fill="#20372E" font-weight="700">Buitres negros y curiquingues</text>
<text x="20" y="116" font-family="Arial" font-size="13" fill="#20372E">Parada 5 · un único QR</text>
<rect x="18" y="154" width="354" height="66" fill="#EAF2E8" stroke="#E0E8DD"/>
<rect x="18" y="220" width="354" height="156" fill="#FFFFFF" stroke="#E0E8DD"/>
<rect x="18" y="376" width="354" height="156" fill="#FFFFFF" stroke="#E0E8DD"/>
<path d="M132 154V532" stroke="#E0E8DD"/>
<path d="M249 154V532" stroke="#E0E8DD"/>
<text x="26" y="180" font-family="Arial" font-size="13" fill="#20372E" font-weight="700">Animal</text>
<text x="140" y="180" font-family="Arial" font-size="13" fill="#20372E" font-weight="700">Qué come</text>
<text x="257" y="180" font-family="Arial" font-size="13" fill="#20372E" font-weight="700">Dónde vive /</text>
<text x="257" y="198" font-family="Arial" font-size="13" fill="#20372E" font-weight="700">origen</text>
<text x="26" y="247" font-family="Arial" font-size="13" fill="#20372E" font-weight="700">Buitre negro</text>
<text x="140" y="247" font-family="Arial" font-size="13" fill="#20372E">Principalmente</text>
<text x="140" y="266" font-family="Arial" font-size="13" fill="#20372E">carroña;</text>
<text x="140" y="285" font-family="Arial" font-size="13" fill="#20372E">también huevos</text>
<text x="140" y="304" font-family="Arial" font-size="13" fill="#20372E">y animales</text>
<text x="140" y="323" font-family="Arial" font-size="13" fill="#20372E">pequeños.</text>
<text x="257" y="247" font-family="Arial" font-size="13" fill="#20372E">Gran parte de</text>
<text x="257" y="266" font-family="Arial" font-size="13" fill="#20372E">América; en</text>
<text x="257" y="285" font-family="Arial" font-size="13" fill="#20372E">Ecuador, Costa,</text>
<text x="257" y="304" font-family="Arial" font-size="13" fill="#20372E">Andes y zonas</text>
<text x="257" y="323" font-family="Arial" font-size="13" fill="#20372E">abiertas.</text>
<text x="26" y="403" font-family="Arial" font-size="13" fill="#20372E" font-weight="700">Curiquingue</text>
<text x="140" y="403" font-family="Arial" font-size="13" fill="#20372E">Principalmente</text>
<text x="140" y="422" font-family="Arial" font-size="13" fill="#20372E">carroña;</text>
<text x="140" y="441" font-family="Arial" font-size="13" fill="#20372E">también</text>
<text x="140" y="460" font-family="Arial" font-size="13" fill="#20372E">pequeños</text>
<text x="140" y="479" font-family="Arial" font-size="13" fill="#20372E">vertebrados e</text>
<text x="140" y="498" font-family="Arial" font-size="13" fill="#20372E">invertebrados.</text>
<text x="257" y="403" font-family="Arial" font-size="13" fill="#20372E">Páramos de los</text>
<text x="257" y="422" font-family="Arial" font-size="13" fill="#20372E">Andes, desde el</text>
<text x="257" y="441" font-family="Arial" font-size="13" fill="#20372E">sur de Colombia</text>
<text x="257" y="460" font-family="Arial" font-size="13" fill="#20372E">hasta Ecuador.</text>
<text x="20" y="566" font-family="Arial" font-size="12" fill="#20372E">Buitre negro: Coragyps atratus</text>
<text x="20" y="588" font-family="Arial" font-size="12" fill="#20372E">Curiquingue: Phalcoboenus carunculatus</text>
<text x="20" y="620" font-family="Arial" font-size="12" fill="#20372E">Dos animales, una parada y un único QR.</text>
<text x="20" y="646" font-family="Arial" font-size="12" fill="#20372E">Fuente: fichas oficiales de Bioparque Amaru.</text>
<rect x="18" y="680" width="354" height="48" rx="14" fill="#2F6B4B"/><text x="195" y="710" text-anchor="middle" font-family="Arial" font-size="15" fill="white">Ver esta parada en el mapa</text>
