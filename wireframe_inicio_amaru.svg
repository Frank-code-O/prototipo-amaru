<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Inicio de la app del Bioparque Amaru</title>
<desc id="desc">Pantalla de inicio que presenta el recorrido, el progreso de visita y accesos al mapa y la información del zoológico. La app funciona sin conexión y no usa GPS.</desc>
<rect width="390" height="844" fill="#f6f4ec"/>
