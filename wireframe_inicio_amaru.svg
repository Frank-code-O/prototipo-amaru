<text x="38" y="159" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1" fill="#55745b">DESCUBRE EL BIOPARQUE</text><text x="38" y="197" font-family="Arial" font-size="25" font-weight="700" fill="#20372e">Explora Amaru</text><text x="38" y="227" font-family="Arial" font-size="16" fill="#304539">a tu propio ritmo.</text><text x="38" y="257" font-family="Arial" font-size="12" fill="#65756c">Consulta el mapa, conoce a los animales</text><text x="38" y="275" font-family="Arial" font-size="12" fill="#65756c">y marca cada parada al leer su QR.</text>
<rect x="18" y="447" width="354" height="122" rx="18" fill="white" stroke="#e0e8dd"/><text x="36" y="477" font-family="Arial" font-size="13" font-weight="700" fill="#304539">Tu recorrido de hoy</text><text x="350" y="478" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#2f6b4b">0/24</text><rect x="36" y="491" width="318" height="9" rx="5" fill="#e4ebe1"/><rect x="36" y="491" width="0" height="9" rx="5" fill="#2f6b4b"/><text x="36" y="526" font-family="Arial" font-size="11" fill="#65756c">El avance se guarda para esta visita.</text><text x="36" y="547" font-family="Arial" font-size="11" fill="#65756c">No necesitas GPS ni conexión a internet.</text>
<rect x="18" y="592" width="354" height="54" rx="16" fill="#2f6b4b"/><text x="195" y="625" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Explorar el mapa</text><rect x="18" y="660" width="354" height="48" rx="15" fill="white" stroke="#dce5da"/><text x="195" y="690" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#2f6b4b">Información y cómo llegar</text>
