<text x="74" y="72" font-family="Arial" font-size="18" font-weight="700" letter-spacing="1" fill="#2f6b4b">AMARU</text><text x="74" y="88" font-family="Arial" font-size="10" fill="#65756c">BIOPARQUE · CUENCA</text>
